name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI green every commit: ruff + mypy + full pytest.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # MergeGate wires into the shared agent-authorization-gateway engine
          # rather than reimplementing the proof layer; it must be present.
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Types (mypy)
        run: mypy mergegate tests

      - name: Tests (pytest)
        run: pytest -q
