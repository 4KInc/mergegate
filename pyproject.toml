[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mergegate"
version = "0.1.0"
description = "Deterministic evaluator and conditional USDC settlement layer for autonomous coding agents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Heartlin Machado" }]
dependencies = [
    "cryptography>=44.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "httpx>=0.28.0",
    "pydantic>=2.9.0",
    "jinja2>=3.1.0",
    # For serving the OpenAPI spec as YAML. Hand-rolling a YAML emitter was
    # the alternative, and YAML quoting and escaping rules are exactly what not
    # to improvise when the output is meant to be parsed by someone else's tool.
    "pyyaml>=6.0",
    "google-cloud-storage>=2.18.0",
    "google-cloud-firestore>=2.19.0",
    "google-cloud-run>=0.10.0",
    "web3>=7.0.0",
    "eth-account>=0.13.0",
]

[project.optional-dependencies]
# Optional on purpose. The deterministic core runs without it, and the advisory
# layer reports itself unavailable rather than failing, so a deployment that
# omits this settles exactly as before.
gemini = ["google-genai>=1.0.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0",
    "types-requests",
    "httpx",
]

[project.scripts]
mergegate = "mergegate.cli:main"
mergegate-mcp = "mergegate.mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["mergegate"]
# Jinja templates are package data; without this the wheel ships code that
# renders nothing. The same applies to the brand mark: the pages reference it
# by URL, so a wheel without it renders broken images rather than failing loudly.
artifacts = ["mergegate/templates/*.html", "mergegate/static/*.png"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# The shared engine is a vendored submodule owned by another repo. We wire into
# it; we do not restyle it.
extend-exclude = ["engine", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
# The shared engine is a vendored submodule with its own (looser) type posture;
# we type-check the MergeGate surface that wraps it, not the engine internals.
exclude = ["^engine/"]

# google-cloud client libs ship partial stubs; they are exercised in
# deployment, not type-checked here.
[[tool.mypy.overrides]]
module = ["google.cloud.*", "google.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["gateway.*"]
ignore_missing_imports = true
follow_imports = "skip"
